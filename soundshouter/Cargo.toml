[package]
name = "soundshouter"
version = "0.1.1"
edition = "2021"

[dependencies]
rocket = { version = "0.5.1", features = ["json"]}
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_sqlite_pool"] }
rumqttd = "0.20.0"
rumqttc = "0.25.1"
config = "0.15.19"
rodio = "0.20.1"
tokio = "1.49.0"
diesel = { version = "2.3.5", features = ["sqlite", "r2d2", "returning_clauses_for_sqlite_3_35"] }
dotenvy = "0.15.7"
log = "0.4.29"
serde = "1.0.228"
utoipa = { version = "5.4.0" } #, features = ["rocket_extras"]} #, features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["rocket"] }
directories = "6.0.0"
clap = "4.5.54"
toml = "0.9.8"
diesel_migrations = "2.3.1"
# wird von der api verwendet
serde_json = "1.0.148"
log4rs = "1.4.0"
rust-embed = "8.9.0"
